name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Before the tests, not after: dist/ is gitignored, so a fresh checkout has
      # no dashboard, and the serve banner says a different thing when there is
      # none. Building first is what makes CI test the shape a user installs.
      - run: npm run build
      - run: npm test
